<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CiKiZz Store</title>
<style>
body{margin:0;background:#0b1222;color:#fff;font-family:Inter,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#111b32;border-bottom:1px solid #1e2a4a}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:44px;height:44px;background:#0f1e3a;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #2a3b66}
.brand b{font-size:18px}
.brand span{font-size:13px;color:#6d8bc5;display:block}
.btns{display:flex;gap:10px}
.btn{padding:10px 18px;border-radius:24px;border:1px solid #2a3b66;background:#1a2744;color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:13px}
.btn.primary{background:#2f6bff;border-color:#2f6bff}
.wrap{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto}
.card{background:#141f38;border:1px solid #223157;border-radius:20px;padding:18px;position:relative}
.badge{position:absolute;top:-10px;left:14px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px}
.badge.blue{background:#2f6bff}
.badge.light{background:#3b82f6}
.badge.orange{background:#f59e0b;color:#000}
.icon-box{width:40px;height:40px;background:#0f1a30;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-top:8px;border:1px solid #223157}
.card h3{margin:12px 0 4px 0;font-size:18px}
.card p{margin:0;color:#8fa3c7;font-size:13px}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.price{color:#4f8cff;font-weight:700;font-size:18px}
.buy{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:1px solid #2d4a8a;background:transparent;color:#8fb0ff;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b8def" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </div>
    <div><b>CiKiZz Store</b><span>reseller</span></div>
  </div>
  <div class="btns">
    <a class="btn" href="#">Logout</a>
    <a class="btn primary" href="#">Pesanan</a>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="badge blue">BESTSELLER</div>
    <div class="icon-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    </div>
    <h3>Script Bot Anti Ban V3</h3>
    <p>Fitur lengkap auto backup</p>
    <div class="card-foot">
      <div class="price">Rp 50.000</div>
      <button class="buy">Beli <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    </div>
  </div>

  <div class="card">
    <div class="badge light">POPULER</div>
    <div class="icon-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <h3>Sewa Bot 30 Hari</h3>
    <p>Sewa 24/7 online</p>
    <div class="card-foot">
      <div class="price">Rp 30.000</div>
      <button class="buy">Beli <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    </div>
  </div>

  <div class="card">
    <div class="badge orange">VIP</div>
    <div class="icon-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
    </div>
    <h3>Panel VIP Privat</h3>
    <p>Akses reseller auto create</p>
    <div class="card-foot">
      <div class="price">Rp 15.000</div>
      <a href="/vip.html" style="text-decoration:none"><button class="buy">Beli <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button></a>
    </div>
  </div>
</div>
</body>
</html>
