<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CiKiZz Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#0b1222;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111b32;border-bottom:1px solid #1e2a4a;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:42px;height:42px;background:#0f1e3a;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #2a3b66}
.btn{padding:8px 14px;border-radius:20px;border:1px solid #2a3b66;background:#1a2744;color:#fff;font-weight:600;cursor:pointer;font-size:12px}.btn.primary{background:#2f6bff;border-color:#2f6bff}.btn.orange{background:#f59e0b;color:#000;font-weight:800}
.wrap{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:500px;margin:0 auto}
.card{background:#141f38;border:1px solid #223157;border-radius:20px;padding:18px;position:relative}
.badge{position:absolute;top:-10px;left:14px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px}.badge.blue{background:#2f6bff}.badge.light{background:#3b82f6}.badge.orange{background:#f59e0b;color:#000}
.icon-box{width:40px;height:40px;background:#0f1a30;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-top:8px;border:1px solid #223157}
.card h3{margin:10px 0 4px 0;font-size:17px}.card p{margin:0;color:#8fa3c7;font-size:12px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.price{color:#4f8cff;font-weight:700}
.buy{padding:7px 14px;border-radius:20px;border:1px solid #2d4a8a;background:transparent;color:#8fb0ff;cursor:pointer}
#authGate{position:fixed;inset:0;z-index:500;background:#0b1222;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{width:100%;max-width:360px;background:#141f38;border:1px solid #223157;border-radius:20px;padding:20px}
.input{width:100%;padding:11px;border-radius:12px;border:1px solid #223157;background:#0f1a30;color:#fff;outline:none;margin-top:10px}
.role{display:flex;gap:6px;margin:12px 0}.role button{flex:1;padding:8px;border-radius:12px;border:1px solid #223157;background:#0f1a30;color:#8fa3c7;cursor:pointer;font-size:11px;font-weight:700}.role button.active{background:#2f6bff;color:#fff;border-color:#2f6bff}
#mainContent,#adminContent{display:none}#mainContent.active,#adminContent.active{display:block}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#141f38;border:1px solid #223157;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:16px;display:block}.stat span{font-size:10px;color:#6d8bc5}
.tag{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}.tag.pending{background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.3);color:#fde047}.tag.done{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#86efac}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e2a4a;border:1px solid #2a3b66;padding:10px 14px;border-radius:12px;font-size:12px;transition:.3s;z-index:1000}.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}.modal.active{display:flex}.modal-box{background:#141f38;border:1px solid #223157;border-radius:20px;padding:18px;width:100%;max-width:380px}
</style>
</head>
<body>

<div id="authGate"><div class="auth-card">
<div style="display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:10px"><div class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b8def" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div><div><b>CiKiZz Store</b><div style="font-size:11px;color:#6d8bc5">Login Public / Reseller / Admin</div></div></div>
<div class="role"><button type="button" id="rolePublic" class="active" onclick="setRole('public')">Public</button><button type="button" id="roleReseller" onclick="setRole('reseller')">Reseller</button><button type="button" id="roleAdmin" onclick="setRole('admin')">Admin</button></div>
<input id="gUser" class="input" placeholder="Username"><input id="gPass" type="password" class="input" placeholder="Password"><button type="button" class="btn primary" style="width:100%;margin-top:12px;padding:11px" onclick="gateLogin()">Masuk →</button>
</div></div>

<div id="mainContent">
<div class="top"><div class="brand"><div class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b8def" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div><div><b>CiKiZz Store</b><span id="userName" style="font-size:11px;color:#6d8bc5;display:block"></span></div></div><div style="display:flex;gap:6px"><button type="button" class="btn" onclick="openUserOrders()">Pesanan</button><button type="button" class="btn" onclick="logout()">Logout</button></div></div>
<div class="wrap" id="grid"></div>
</div>

<div id="adminContent">
<div class="top"><div class="brand"><div class="brand-icon">👑</div><div><b>Admin CiKiZz</b></div></div><button type="button" class="btn" onclick="logout()">Logout</button></div>
<div class="wrap">
<div class="role"><button type="button" id="at1" class="active" onclick="showAdminTab('overview')">Overview</button><button type="button" id="at2" onclick="showAdminTab('products')">Produk</button><button type="button" id="at3" onclick="showAdminTab('orders')">Pesanan</button><button type="button" id="at4" onclick="showAdminTab('reseller')">Reseller</button></div>
<div id="admin-overview"><div class="stat-grid"><div class="stat"><b id="aTotalProduk">0</b><span>Produk</span></div><div class="stat"><b id="aPending">0</b><span>Pending</span></div><div class="stat"><b id="aDone">0</b><span>Selesai</span></div><div class="stat"><b id="aOmzet">0</b><span>Omzet</span></div></div></div>
<div id="admin-products" style="display:none"><div class="card"><h3>Tambah Produk</h3><input id="pTitle" class="input" placeholder="Nama"><input id="pDesc" class="input" placeholder="Deskripsi"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="pPrice" class="input" placeholder="Harga angka"><select id="pCat" class="input"><option>BESTSELLER</option><option>POPULER</option><option>VIP</option><option>BARU</option></select></div><button type="button" class="btn primary" style="width:100%;margin-top:10px" onclick="addProduct()">Tambah Produk</button></div><div class="card"><div id="aProductList"></div></div></div>
<div id="admin-orders" style="display:none"><div class="card"><h3>Pesanan</h3><div id="aOrderList" style="margin-top:8px"></div></div></div>
<div id="admin-reseller" style="display:none"><div class="card"><h3>Setting Reseller</h3><input id="setResellerUser" class="input" placeholder="Username reseller"><input id="setResellerPass" class="input" placeholder="Password reseller"><button type="button" class="btn primary" style="width:100%;margin-top:10px;background:#a855f7" onclick="saveResellerCreds()">Simpan Akun Reseller</button><div id="currentConfig" style="font-size:11px;color:#8fa3c7;margin-top:8px"></div><div style="font-size:10px;color:#64748b;margin-top:6px">Akun ini yang bisa login ke /vip.html</div></div></div>
</div>
</div>

<div class="modal" id="modal"><div class="modal-box"><div style="display:flex;justify-content:space-between"><b id="mTitle"></b><span onclick="document.getElementById('modal').classList.remove('active')" style="cursor:pointer">✕</span></div><p id="mDesc" style="font-size:12px;color:#8fa3c7;margin-top:6px"></p><div id="mPrice" style="color:#4f8cff;font-weight:700;margin-top:8px"></div><button type="button" class="btn primary" style="width:100%;margin-top:12px" onclick="confirmOrder()">Order via WA</button></div></div>
<div class="modal" id="userOrderModal"><div class="modal-box"><div style="display:flex;justify-content:space-between"><b>Pesanan Saya</b><span onclick="document.getElementById('userOrderModal').classList.remove('active')" style="cursor:pointer">✕</span></div><div id="userOrderList" style="margin-top:10px"></div></div></div>
<div class="toast" id="toast"></div>

<script>
let role='public';
let products=JSON.parse(localStorage.getItem('products')||'null')||[
{title:'Script Bot Anti Ban V3',desc:'Fitur lengkap auto backup',priceLabel:'Rp 50.000',price:50000,badge:'BESTSELLER',badgeClass:'blue',wa:'ANTI BAN V3',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>'},
{title:'Sewa Bot 30 Hari',desc:'Sewa 24/7 online',priceLabel:'Rp 30.000',price:30000,badge:'POPULER',badgeClass:'light',wa:'SEWA 30 HARI',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'},
{title:'Panel VIP Privat',desc:'Khusus reseller - beli dulu untuk jadi reseller',priceLabel:'Rp 15.000',price:15000,badge:'VIP',badgeClass:'orange',wa:'PANEL VIP',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>'},
];
function saveProducts(){localStorage.setItem('products',JSON.stringify(products))}
function getOrders(){return JSON.parse(localStorage.getItem('orders')||'[]')}function saveOrders(o){localStorage.setItem('orders',JSON.stringify(o))}
function getResellerCreds(){return JSON.parse(localStorage.getItem('resellerCreds')||'{"user":"reseller","pass":"reseller123"}')}
let selected=null;
function render(){const g=document.getElementById('grid');g.innerHTML='';products.forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="badge ${p.badgeClass}">${p.badge}</div><div class="icon-box">${p.icon}</div><h3>${p.title}</h3><p>${p.desc}</p><div class="card-foot"><div class="price">${p.priceLabel}</div><button type="button" class="buy" onclick="openModal('${p.title.replace(/'/g,"\\'")}')">Beli →</button></div>`;g.appendChild(d)})}
function openModal(t){selected=products.find(x=>x.title===t);document.getElementById('mTitle').innerText=selected.title;document.getElementById('mDesc').innerText=selected.desc;document.getElementById('mPrice').innerText=selected.priceLabel;document.getElementById('modal').classList.add('active')}
function confirmOrder(){let o=getOrders();o.push({id:Date.now(),...selected,status:'pending',time:new Date().toLocaleString(),user:localStorage.getItem('user')});saveOrders(o);window.open(`https://wa.me/62882000572938?text=${encodeURIComponent('Order '+selected.wa)}`,'_blank');document.getElementById('modal').classList.remove('active');showToast('PENDING');updateAdmin()}
function setRole(r){role=r;['public','reseller','admin'].forEach(x=>{const el=document.getElementById('role'+x.charAt(0).toUpperCase()+x.slice(1));if(el)el.className=r===x?'active':''})}
function gateLogin(){
 const u=document.getElementById('gUser').value.trim(),p=document.getElementById('gPass').value.trim();
 if(!u||p.length<3){showToast('isi user pass');return}
 if(role==='admin'){if(u!=='admin'||p!=='admin123'){showToast('admin salah');return}localStorage.setItem('user','admin');localStorage.setItem('role','admin');showAdmin();return}
 if(role==='reseller'){let c=getResellerCreds();if(u!==c.user||p!==c.pass){showToast('reseller salah');return}location.href='/vip.html';return}
 localStorage.setItem('user',u);localStorage.setItem('role','public');showPublic();
}
function showPublic(){document.getElementById('authGate').style.display='none';document.getElementById('mainContent').classList.add('active');document.getElementById('adminContent').classList.remove('active');document.getElementById('userName').innerText=localStorage.getItem('user')+' • public';render();}
function showAdmin(){document.getElementById('authGate').style.display='none';document.getElementById('adminContent').classList.add('active');document.getElementById('mainContent').classList.remove('active');updateAdmin();showAdminTab('overview');}
function showAdminTab(t){['overview','products','orders','reseller'].forEach(x=>{document.getElementById('admin-'+x).style.display=x===t?'block':'none';const btn=document.getElementById('at'+(['overview','products','orders','reseller'].indexOf(x)+1));if(btn)btn.className=x===t?'active':''});}
function updateAdmin(){const o=getOrders();document.getElementById('aTotalProduk').innerText=products.length;document.getElementById('aPending').innerText=o.filter(x=>x.status==='pending').length;document.getElementById('aDone').innerText=o.filter(x=>x.status==='done').length;document.getElementById('aOmzet').innerText='Rp '+o.filter(x=>x.status==='done').reduce((s,x)=>s+(x.price||0),0).toLocaleString();document.getElementById('aProductList').innerHTML=products.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e2a4a"><div><b style="font-size:12px">${p.title}</b><div style="font-size:10px;color:#6d8bc5">${p.priceLabel}</div></div><button type="button" class="btn" style="padding:4px 8px" onclick="deleteProduct(${i})">Hapus</button></div>`).join('');document.getElementById('aOrderList').innerHTML=o.length?o.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #1e2a4a"><b style="font-size:12px">${x.title}</b> <span class="tag ${x.status==='pending'?'pending':'done'}">${x.status}</span><br><small style="color:#6d8bc5">${x.user} • ${x.time}</small>${x.status==='pending'?`<div style="margin-top:6px;display:flex;gap:6px"><button type="button" class="btn primary" style="padding:4px 8px" onclick="updateOrderStatus(${x.id},'done')">Done</button><button type="button" class="btn" style="padding:4px 8px" onclick="updateOrderStatus(${x.id},'cancel')">Batal</button></div>`:''}</div>`).join(''):'belum ada';let c=getResellerCreds();document.getElementById('currentConfig').innerText=`Akun reseller sekarang: ${c.user} / ${c.pass}`;}
function addProduct(){const t=document.getElementById('pTitle').value.trim(),d=document.getElementById('pDesc').value.trim(),pr=parseInt(document.getElementById('pPrice').value.replace(/[^0-9]/g,''))||0,cat=document.getElementById('pCat').value;if(!t||!pr){showToast('isi nama harga');return}products.push({title:t,desc:d||'Custom',price:pr,priceLabel:'Rp '+pr.toLocaleString(),badge:cat,badgeClass:cat==='VIP'?'orange':cat==='BESTSELLER'?'blue':'light',wa:t,icon:'📦'});saveProducts();updateAdmin();render();showToast('produk ditambah')}
function deleteProduct(i){products.splice(i,1);saveProducts();updateAdmin();render();}
function saveResellerCreds(){const u=document.getElementById('setResellerUser').value.trim(),p=document.getElementById('setResellerPass').value.trim();if(!u||!p){showToast('isi');return}localStorage.setItem('resellerCreds',JSON.stringify({user:u,pass:p}));showToast('reseller disimpan');updateAdmin();}
function openUserOrders(){let o=getOrders().filter(x=>x.user===localStorage.getItem('user'));document.getElementById('userOrderList').innerHTML=o.length?o.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #1e2a4a"><b style="font-size:12px">${x.title}</b> <span class="tag ${x.status}">${x.status}</span></div>`).join(''):'belum ada pesanan';document.getElementById('userOrderModal').classList.add('active')}
function updateOrderStatus(id,s){let o=getOrders();let idx=o.findIndex(x=>x.id===id);if(idx>-1){if(s==='cancel')o.splice(idx,1);else o[idx].status=s;saveOrders(o);updateAdmin()}}
function logout(){localStorage.removeItem('user');localStorage.removeItem('role');document.getElementById('authGate').style.display='flex';document.getElementById('mainContent').classList.remove('active');document.getElementById('adminContent').classList.remove('active');history.replaceState(null,'',location.pathname)}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
window.onload=()=>{render();if(location.hash)history.replaceState(null,'',location.pathname)}
</script>
</body>
</html>
